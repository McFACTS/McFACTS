# settings.ini
# Default settings for a single McFACTS run.
# Values here match the defaults in src/mcfacts/inputs/settings_manager.py.
# See IOdocumentation.txt for more detail on the physics parameters.

[io]
# Print detailed log output during the run. (default = False)
verbose = False
# Show a per galaxy progress bar for the timeline. (default = False)
show_timeline_progress = False
# Delete output_dir if it already exists. The run aborts if this is off and the directory is present. (default = False)
overwrite_files = False
# Save galaxy state to disk at the end of each galaxy. (default = False)
save_state = False
# Save galaxy state to disk after every timestep. Writes a lot of files. (default = False)
save_each_timestep = False
# Directory to write run output into. (default = "./runs")
output_dir = ./runs
# Path of the settings file to load. Set by the '-s' flag, left blank here. (default = "")
settings_file =

[sim]
# Timestep length in years. (default = 10000.0)
active_timestep_duration_yr = 10000.0
# Number of timesteps. Disk lifetime is active_timestep_duration_yr * active_timestep_num. (default = 70)
active_timestep_num = 70
# Time between disk captures in years. Secunda et al. (2021) assume 1 per 0.1 Myr. (default = 100000.0)
capture_time_yr = 100000.0
# Number of galaxies to run. (default = 100)
galaxy_num = 100
# Random seed. The specific seed used by nth galaxy is 'seed - n'. (default = 223849053863469657747974663531730220530)
seed = 223849053863469657747974663531730220530
# SMBH mass in M_sun. (default = 100000000.0)
smbh_mass = 100000000.0
# FIXED -- Redshift of the AGN. Fixed value, edits here are ignored. (default = 0.1)
agn_redshift = 0.1

[disk]
# Use pAGN to generate the disk model. If off, tabulated models are read from src/mcfacts/inputs/data/. (default = True)
flag_use_pagn = True
# Disk model name. Options are sirko_goodman and thompson_etal. (default = sirko_goodman)
disk_model_name = sirko_goodman
# Migration trap radius in r_g of the SMBH. Set to 0 if the disk has no trap. (default = 700.0)
disk_radius_trap = 700.0
# Disk outer radius in r_g of the SMBH. (default = 50000.0)
disk_radius_outer = 50000.0
# Disk viscosity alpha parameter. (default = 0.01)
disk_alpha_viscosity = 0.01
# Average disk aspect ratio out to the outer radius. (default = 0.03)
disk_aspect_ratio_avg = 0.03
# Fraction of initial mass toe accrete to align BH with the disk. Bogdanovic et al. (2007) give 0.01 to 0.1. (default = 0.1)
disk_bh_torque_condition = 0.1
# BH Eddington accretion rate. Super-Eddington values are allowed. (default = 1.0)
disk_bh_eddington_ratio = 1.0
# Maximum allowed initial orbital eccentricity of a single BH around the SMBH. (default = 0.9)
disk_bh_orb_ecc_max_init = 0.9
# Outer radius for disk capture in r_g. (default = 1000.0)
disk_radius_capture_outer = 1000.0
# Orbital eccentricities below this value count as circular and can migrate or form binaries. (default = 0.01)
disk_bh_pro_orb_ecc_crit = 0.01
# Outer radius of the inner disk in r_g. (default = 50.0)
inner_disk_outer_radius = 50.0
# Maximum disk radius in parsecs. Set to 0 to turn this off. (default = 0.0)
disk_radius_max_pc = 0.0
# Innermost stable circular orbit around the SMBH in r_g. (default = 6.0)
disk_inner_stable_circ_orb = 6.0
# Type 1 migration torque prescription. Options are 'paardekooper', 'jimenez_masset' and 'old'. (default = paardekooper)
torque_prescription = paardekooper
# Apply the phenomenological turbulence model to migration distances. (default = False)
flag_phenom_turb = False
# Centroid of the Gaussian turbulent perturbation. 0 correlates to no net drift. (default = 0.0)
phenom_turb_centroid = 0.0
# Standard deviation of the Gaussian turbulent perturbation. (default = 0.1)
phenom_turb_std_dev = 0.1

[bh]
# Location of the mass pile up in M_sun. (default = 35.0)
mass_pile_up = 35.0
# UNUSED -- Binary formation uses disk_bh_pro_orb_ecc_crit instead. (default = 0.01)
initial_binary_orbital_ecc = 0.01
# Fraction of binaries that form as retrograde. (default = 0.0)
fraction_bin_retro = 0.0
# Merger kick model. False uses the analytic form from Akiba et al. (2024), True uses NRSurrogate. (default = False)
flag_use_surrogate = False
# Artificially raise later generation spins.
# 2g spins below 0.75 are redrawn from [0.75, 0.85], 3g+ below 0.85 are redrawn from [0.85, 0.95]. (default = False)
flag_use_spin_check = False
# Mean fractional energy exchanged a 2+1 hardening interaction. (default = 0.9)
mean_harden_energy_delta = 0.9
# Variance of the hardening energy exchange. (default = 0.025)
var_harden_energy_delta = 0.025
# Mean fractional energy exchanged in a strong encounter. (default = 0.1)
delta_energy_strong_mu = 0.1
# Standard deviation of the strong encounter energy exchange. (default = 0.02)
delta_energy_strong_sigma = 0.02
# Modify migration torques using feedback from accretion. (default = True)
flag_thermal_feedback = True
# Damp orbital eccentricity. (default = True)
flag_orb_ecc_damping = True
# Allow dynamical encounters between BH populations. (default = True)
flag_dynamic_enc = True
# Use the faster sweep-based dynamics functions. (default = True)
flag_dynamics_sweep = True
# Use Bondi accretion. (default = False)
flag_enable_bondi = False
# Fraction of the Bondi component when flag_enable_bondi is on. (default = 1e-05)
bondi_fraction = 1e-05
# Binary stalling separation in r_g. (default = 0.0)
stalling_separation = 0.0
# Gas hardening prescription. Options are 'baruteau', 'stahler' and 'analytical'. (default = baruteau)
gas_hardening_prescription = baruteau
# FIXED -- Fractional mass growth per year at the Eddington rate. Fixed value, edits are ignored. (default = 2.3e-08)
disk_bh_eddington_mass_growth_rate = 2.3e-08
# FIXED -- Smallest spin change the code resolves. Fixed value, edits here are ignored. (default = 0.02)
disk_bh_spin_resolution_min = 0.02
# FIXED -- Separation in r_g when a BBH is tracked for gw. Fixed value, edits here are ignored. (default = 2.0)
min_bbh_gw_separation = 2.0

[star]
# Add stars to the disk. (default = False)
flag_add_stars = False
# Minimum star mass for the IMF in M_sun. (default = 5.0)
disk_star_mass_min_init = 5.0
# Maximum star mass for the IMF in M_sun. (default = 40.0)
disk_star_mass_max_init = 40.0
# Exponent for the R_star over R_Hill ratio used in star dynamics. (default = 2.0)
rstar_rhill_exponent_ratio = 2.0
# Factor to scale the number of stars in the disk relative to the number of BH. (default = 0.001)
disk_star_scale_factor = 0.001
# Merge stars inside each other's Hill spheres before the time loop starts. (default = False)
flag_coalesce_initial_stars = False
# Turn stars above disk_star_initial_mass_cutoff into BH. (default = False)
flag_initial_stars_bh_immortal = False
# Maximum initial star mass in M_sun. (default = 298.0)
disk_star_initial_mass_cutoff = 298.0

[nsc]
# Outer radius of the nuclear star cluster in pc. (default = 5.0)
nsc_radius_outer = 5.0
# Mass of the nuclear star cluster in M_sun. (default = 3e7)
nsc_mass = 30000000.0
# Radius in pc where the NSC number density profile changes slope. (default = 0.25)
nsc_radius_crit = 0.25
# Ratio of BH to stars in the NSC. (default = 0.001)
nsc_ratio_bh_num_star_num = 0.001
# Ratio of typical BH mass to typical star mass. (default = 10.0)
nsc_ratio_bh_mass_star_mass = 10.0
# Density profile index inside nsc_radius_crit. (default = 1.75)
nsc_density_index_inner = 1.75
# Density profile index outside nsc_radius_crit. (default = 2.5)
nsc_density_index_outer = 2.5
# Powerlaw index for the stellar IMF. (default = 2.35)
nsc_imf_star_powerlaw_index = 2.35
# Mode of the initial BH mass distribution in M_sun. (default = 10.0)
nsc_imf_bh_mode = 10.0
# Powerlaw index of the Pareto initial BH mass distribution. (default = 2.0)
nsc_imf_bh_powerlaw_index = 2.0
# Maximum initial BH mass in M_sun. (default = 40.0)
nsc_imf_bh_mass_max = 40.0
# Mean of the Gaussian initial BH spin magnitude distribution. (default = 0.0)
nsc_bh_spin_dist_mu = 0.0
# Standard deviation of the initial BH spin magnitude distribution. (default = 0.1)
nsc_bh_spin_dist_sigma = 0.1
# Normalization for the rate of interactions with the spheroid component. (default = 1.0)
nsc_spheroid_normalization = 1.0
# Currently unused.
nsc_star_spin_dist_mu = 100.0
# Currently unused.
nsc_star_spin_dist_sigma = 20.0
# Initial stellar hydrogen mass fraction. (default = 0.7064)
nsc_star_metallicity_x_init = 0.7064
# Initial stellar helium mass fraction. (default = 0.2735)
nsc_star_metallicity_y_init = 0.2735
# Initial stellar metal mass fraction. (default = 0.02)
nsc_star_metallicity_z_init = 0.02
# Method to draw the BH IMF. Options are 'default', 'uniform', 'gaussian', or a filename of samples. (default = default)
nsc_imf_bh_method = default

[scale]
disk_truncation = none
flag_use_scaling = false
stellar_mass = 0.
scale_smbh_mass = schramm-silverman
scale_nsc_mass = neumayer-early
scale_inner_disk = decay-time
scale_trap = sqrt-smbh
scale_capture_radius = sqrt-smbh
scale_capture_time = WZL+2024

[arrays]
# Names of the object arrays held in the filing cabinet.
# These are internal identifiers. Values are fixed and edits here are ignored.
# ----
# Unclassified BH, before they are sorted into prograde and retrograde.
bh_array_name = blackholes_unsort
# BH that have migrated inside inner_disk_outer_radius.
bh_inner_disk_array_name = blackholes_inner_disk
# Inner disk BH tracked for gravitational waves only.
bh_inner_gw_array_name = blackholes_inner_gw_only
# Single BH orbiting prograde to the disk.
bh_prograde_array_name = blackholes_prograde
# Single BH orbiting retrograde to the disk.
bh_retrograde_array_name = blackholes_retrograde
# Stars orbiting prograde to the disk.
stars_prograde_array_name = stars_prograde
# Stars orbiting retrograde to the disk.
stars_retrograde_array_name = stars_retrograde
# Stars that have merged with each other.
stars_merged_array_name = stars_merged
# Binary black holes.
bbh_array_name = blackholes_binary
# Binaries tracked for gravitational waves, below min_bbh_gw_separation.
bbh_gw_array_name = blackholes_binary_gw
# Merger remnants of binary black holes.
bbh_merged_array_name = blackholes_merged
# Extreme mass ratio inspirals onto the SMBH.
emri_array_name = blackholes_emri
# Unclassified stars, before they are sorted into prograde and retrograde.
star_array_name = stars_unsort
# BH that have migrated past disk_radius_outer and left the disk.
bh_ejected_array_name = blackholes_ejected
# Currently unused.
bbh_inter_array_name = blackholes_binary_inter
